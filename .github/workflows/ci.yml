name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The same tests in three browsers. The first job keeps the name
  # "checks", which the protection of main asks for.
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # A job that hangs is stopped and shows red. With no limit it would
    # hold a pull request for six hours.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: checks, browser: chromium }
          - { name: firefox, browser: firefox }
          - { name: webkit, browser: webkit }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The system libraries of a browser come from the machine's package
      # mirror, which now and then stands still in the middle of a
      # download. In 51 runs of November 2026 the first try ran out of
      # time 11 times, and a second try at the same mirror stood still
      # too in 3 of them, all in the webkit job, which then never
      # reached a test. The machine's own patience, fifteen seconds for
      # a connection that says nothing, does not end such a download.
      #
      # An install that goes well takes under a minute and a half, so
      # the first try gets three. Where it does not finish, the second
      # asks Ubuntu's own archive in place of the machine's mirror: a
      # trial installed each of the three browsers from there in twenty
      # seconds. On a machine that keeps its mirrors elsewhere the
      # second try asks the same mirror again, as before.
      - name: Install the browser the pages are checked in
        id: browser
        timeout-minutes: 3
        continue-on-error: true
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Install it again from another mirror, where the first try did not finish
        if: steps.browser.outcome != 'success'
        timeout-minutes: 6
        run: |
          sudo killall -q apt-get dpkg || true
          sudo dpkg --configure -a || true
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt || true
          cat /etc/apt/apt-mirrors.txt || true
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Check the types
        if: matrix.browser == 'chromium'
        run: npm run typecheck
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Build the FadoDB server the tests start, from the commit package.json names
        run: |
          engine="$(node -p "require('./package.json').config.engine")"
          go install "github.com/MojoHand70/fadodb/cmd/fadodb@${engine}"
          echo "FADODB_BIN=$(go env GOPATH)/bin/fadodb" >> "$GITHUB_ENV"
      - name: Open the pages in the browser, in front of the server
        run: npm test
        env:
          TEST_BROWSER: ${{ matrix.browser }}
