name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install the browser the pages are checked in
        run: npx playwright install --with-deps chromium
      - name: Check the types
        run: npm run typecheck
      - name: Open the pages in the browser
        run: npm test
