name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The same tests in three browsers. The first job keeps the name
  # "checks", which the protection of main asks for.
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # A job that hangs is stopped and shows red. With no limit it would
    # hold a pull request for six hours.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: checks, browser: chromium }
          - { name: firefox, browser: firefox }
          - { name: webkit, browser: webkit }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The system libraries of a browser come from the machine's package
      # mirror, which now and then stops answering in the middle. The
      # first try gets six minutes; where it does not finish, the package
      # manager is put right and there is one more.
      - name: Install the browser the pages are checked in
        id: browser
        timeout-minutes: 6
        continue-on-error: true
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Install it again, where the first try did not finish
        if: steps.browser.outcome != 'success'
        timeout-minutes: 8
        run: |
          sudo killall -q apt-get dpkg || true
          sudo dpkg --configure -a || true
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Check the types
        if: matrix.browser == 'chromium'
        run: npm run typecheck
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Build the FadoDB server the tests start, from the commit package.json names
        run: |
          engine="$(node -p "require('./package.json').config.engine")"
          go install "github.com/MojoHand70/fadodb/cmd/fadodb@${engine}"
          echo "FADODB_BIN=$(go env GOPATH)/bin/fadodb" >> "$GITHUB_ENV"
      - name: Open the pages in the browser, in front of the server
        run: npm test
        env:
          TEST_BROWSER: ${{ matrix.browser }}
