<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings · FadoDB Workshop</title>
<link rel="stylesheet" href="workshop.css">
<!-- Workshop has no icon yet. An empty one is named, so that no browser asks the server for /favicon.ico. -->
<link rel="icon" href="data:,">
<script type="module" src="settings.js"></script>
</head>
<body class="framed">

<header class="top">
  <a class="brand" href="./">
    <img class="brand-mark" src="mark.png" width="32" height="32" alt="">
    <span class="brand-name">FadoDB</span>
    <span class="brand-tag">workshop</span>
  </a>
  <div class="find" id="find-box" role="search" hidden>
    <input class="input" id="find" type="search" aria-label="Find an app" placeholder="Find an app" autocomplete="off" spellcheck="false" enterkeyhint="go">
  </div>
  <div class="who" id="who" hidden>
    <button class="who-open" id="who-open" type="button" popovertarget="who-menu">
      <span class="who-mark" id="who-mark" aria-hidden="true"></span>
      <span class="who-name" id="who-name"></span>
    </button>
    <div class="who-menu" id="who-menu" popover>
      <p class="who-is"><span class="who-full" id="who-full"></span><code class="who-id" id="who-id"></code></p>
      <a class="who-way" id="who-account" href="/auth/account">Account</a>
      <button class="who-way" id="sign-out" type="button">Sign out</button>
    </div>
  </div>
</header>

<div class="frame">
  <nav class="rail" id="rail" aria-label="Workshop" hidden></nav>

  <main class="page page-frame">
    <nav class="crumbs" id="crumbs" aria-label="Where you are" hidden></nav>

    <!-- The settings are a database administrator's. Each part is a view; the rail
         and the way above say which one is shown, and its heading is for whoever
         cannot see them. -->
    <section class="settings-part" data-view="server" id="server" hidden>
      <h1 class="unseen">Server</h1>
      <div class="card settings-card">
        <dl class="facts">
          <dt>Address</dt>
          <dd class="mono" id="server-address"></dd>
          <dt>Version</dt>
          <dd class="mono" id="server-version"></dd>
        </dl>
      </div>
    </section>

    <section class="settings-part" data-view="admin" id="admin" hidden>
      <h1 class="unseen">Admin</h1>
      <div class="card settings-card">
        <h2>Administrators</h2>
        <ul class="people" id="administrators"></ul>
      </div>
      <div class="card settings-card">
        <h2>Content administrators</h2>
        <ul class="people" id="content-administrators"></ul>
      </div>
    </section>

    <section class="settings-part" data-view="users" id="users" hidden>
      <h1 class="unseen">Users</h1>
      <div class="table-box">
        <table class="list" id="users-table">
          <thead><tr><th>Name</th><th>Signs in as</th><th>Kind</th><th>System groups</th><th>Groups</th></tr></thead>
          <tbody id="users-rows"></tbody>
        </table>
      </div>
    </section>

    <section class="settings-part" data-view="groups" id="groups" hidden>
      <h1 class="unseen">Groups</h1>
      <div class="table-box" id="groups-box">
        <table class="list" id="groups-table">
          <thead><tr><th>Group</th><th>Members</th></tr></thead>
          <tbody id="groups-rows"></tbody>
        </table>
      </div>
      <p class="lead" id="no-groups" hidden>No groups yet.</p>
    </section>

    <section data-view="trouble" id="trouble" hidden>
      <h1>The settings cannot be shown</h1>
      <div class="card">
        <h2>What the server said</h2>
        <p id="trouble-why"></p>
      </div>
    </section>
  </main>
</div>

</body>
</html>
