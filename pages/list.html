<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The List · FadoDB Workshop</title>
<link rel="stylesheet" href="workshop.css">
<!-- Workshop has no icon yet. An empty one is named, so that no browser asks the server for /favicon.ico. -->
<link rel="icon" href="data:,">
<script type="module" src="list.js"></script>
</head>
<body>

<header class="top">
  <a class="brand" href="./">
    <img class="brand-mark" src="mark.png" width="32" height="32" alt="">
    <span class="brand-name">FadoDB</span>
    <span class="brand-tag">workshop</span>
  </a>
  <div class="who" id="who" hidden>
    <button class="who-open" id="who-open" type="button" popovertarget="who-menu">
      <span class="who-mark" id="who-mark" aria-hidden="true"></span>
      <span class="who-name" id="who-name"></span>
    </button>
    <div class="who-menu" id="who-menu" popover>
      <p class="who-is"><span class="who-full" id="who-full"></span><code class="who-id" id="who-id"></code></p>
      <a class="who-way" id="who-account" href="/auth/account">Account</a>
      <button class="who-way" id="sign-out" type="button">Sign out</button>
    </div>
  </div>
</header>

<main class="page page-wide">
  <nav class="crumbs" id="crumbs" aria-label="Where you are" hidden></nav>
  <section data-view="list" id="list" hidden>
    <div class="doc-head">
      <h1 id="list-title"></h1>
      <div class="doc-do">
        <a class="button button-plain" id="design" href="./" hidden>Design</a>
        <a class="button" id="new" href="./" hidden>New</a>
      </div>
    </div>
    <p class="lead" id="list-about"></p>
    <div class="chips" id="states" role="group" aria-label="Show the documents in one state"></div>
    <p class="count" id="count" aria-live="polite"></p>
    <div class="table-box">
      <table class="list" id="table">
        <thead><tr id="heads"></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="lead" id="empty" hidden></p>
    <button class="button button-plain" id="more" type="button" hidden>Show more</button>
  </section>

  <section data-view="trouble" id="trouble" hidden>
    <h1>This list cannot be shown</h1>
    <div class="card">
      <h2>What the server said</h2>
      <p id="trouble-why"></p>
    </div>
  </section>
</main>

</body>
</html>
