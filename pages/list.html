<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The List · FadoDB Workshop</title>
<link rel="stylesheet" href="workshop.css">
<script type="module" src="list.js"></script>
</head>
<body>

<header class="top">
  <a class="brand" href="./">
    <svg aria-hidden="true" width="28" height="28" viewBox="0 0 28 28" fill="none"><rect x="1" y="1" width="26" height="26" rx="7" fill="#3F74A3"></rect><path d="M9 20V8h10M9 14h8" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    <span class="brand-name">FadoDB</span>
    <span class="brand-tag">workshop</span>
  </a>
  <div class="who" id="who" hidden>
    <a class="who-name" id="who-name" href="/auth/account"></a>
    <button class="button button-plain" id="sign-out" type="button">Sign out</button>
  </div>
</header>

<main class="page page-wide">
  <section data-view="list" id="list" hidden>
    <p class="crumbs"><a href="./">Classes</a></p>
    <div class="doc-head">
      <h1 id="list-title"></h1>
      <a class="button" id="new" href="./" hidden>New</a>
    </div>
    <p class="lead" id="list-about"></p>
    <div class="chips" id="states" role="group" aria-label="Show the documents in one state"></div>
    <p class="count" id="count" aria-live="polite"></p>
    <div class="table-box">
      <table class="list" id="table">
        <thead><tr id="heads"></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="lead" id="empty" hidden></p>
    <button class="button button-plain" id="more" type="button" hidden>Show more</button>
  </section>

  <section data-view="trouble" id="trouble" hidden>
    <p class="crumbs"><a href="./">Classes</a></p>
    <h1>This list cannot be shown</h1>
    <div class="card">
      <h2>What the server said</h2>
      <p id="trouble-why"></p>
    </div>
  </section>
</main>

</body>
</html>
