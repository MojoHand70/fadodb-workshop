<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FadoDB Workshop</title>
<link rel="stylesheet" href="workshop.css">
<!-- Workshop has no icon yet. An empty one is named, so that no browser asks the server for /favicon.ico. -->
<link rel="icon" href="data:,">
<script type="module" src="workshop.js"></script>
</head>
<body>

<header class="top">
  <a class="brand" href="./">
    <img class="brand-mark" src="mark.png" width="32" height="32" alt="">
    <span class="brand-name">FadoDB</span>
    <span class="brand-tag">workshop</span>
  </a>
  <div class="who" id="who" hidden>
    <a class="who-name" id="who-name" href="/auth/account"></a>
    <button class="button button-plain" id="sign-out" type="button">Sign out</button>
  </div>
</header>

<main class="page">
  <section data-view="home" id="home" hidden>
    <div class="find" id="find-box" role="search" hidden>
      <input class="input find-input" id="find" type="search" aria-label="Find by name" placeholder="Find by name" autocomplete="off" spellcheck="false" enterkeyhint="go">
    </div>
    <div class="doc-head home-head">
      <h1>On this server</h1>
      <div class="doc-do">
        <a class="button button-plain" id="new-class" href="design.html?new" hidden>New class</a>
      </div>
    </div>
    <ul class="classes" id="classes"></ul>
    <p class="lead" id="none-found" role="status" aria-live="polite" hidden></p>
    <p class="lead" id="no-classes" hidden></p>
  </section>
</main>

</body>
</html>
