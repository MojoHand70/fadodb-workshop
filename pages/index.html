<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FadoDB Workshop</title>
<link rel="stylesheet" href="workshop.css">
<!-- Workshop has no icon yet. An empty one is named, so that no browser asks the server for /favicon.ico. -->
<link rel="icon" href="data:,">
<script type="module" src="workshop.js"></script>
</head>
<body>

<header class="top">
  <a class="brand" href="./">
    <svg aria-hidden="true" width="28" height="28" viewBox="0 0 28 28" fill="none"><rect x="1" y="1" width="26" height="26" rx="7" fill="#3F74A3"></rect><path d="M9 20V8h10M9 14h8" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    <span class="brand-name">FadoDB</span>
    <span class="brand-tag">workshop</span>
  </a>
  <div class="who" id="who" hidden>
    <a class="who-name" id="who-name" href="/auth/account"></a>
    <button class="button button-plain" id="sign-out" type="button">Sign out</button>
  </div>
</header>

<main class="page">
  <p class="status">Status: you can sign in, read a list, make a document, change it and move it. A designer can read a class in design mode, and cannot change it there yet.</p>

  <section data-view="home" id="home" hidden>
    <h1>Classes on this server</h1>
    <p class="lead">Every class you may see. Choose one to see its list.</p>
    <ul class="classes" id="classes"></ul>
    <p class="lead" id="no-classes" hidden>There is no class here yet.</p>
  </section>
</main>

</body>
</html>
