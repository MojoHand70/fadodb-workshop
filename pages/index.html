<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FadoDB Workshop</title>
<link rel="stylesheet" href="workshop.css">
<!-- Workshop has no icon yet. An empty one is named, so that no browser asks the server for /favicon.ico. -->
<link rel="icon" href="data:,">
<script type="module" src="workshop.js"></script>
</head>
<body class="framed">

<header class="top">
  <a class="brand" href="./">
    <img class="brand-mark" src="mark.png" width="32" height="32" alt="">
    <span class="brand-name">FadoDB</span>
    <span class="brand-tag">workshop</span>
  </a>
  <div class="who" id="who" hidden>
    <a class="who-name" id="who-name" href="/auth/account"></a>
    <button class="button button-plain" id="sign-out" type="button">Sign out</button>
  </div>
</header>

<div class="frame">
  <nav class="rail" id="rail" aria-label="Workshop" hidden></nav>

  <main class="page page-frame">
    <section data-view="home" id="home" hidden>
      <div class="home-head">
        <div class="home-title">
          <h1>Apps</h1>
          <p class="home-about">What runs on this server.</p>
        </div>
        <div class="find" id="find-box" role="search" hidden>
          <input class="input" id="find" type="search" aria-label="Find an app" placeholder="Find an app" autocomplete="off" spellcheck="false" enterkeyhint="go">
        </div>
      </div>

      <ul class="tiles" id="apps"></ul>
      <p class="home-none" id="none-found" role="status" aria-live="polite" hidden></p>

      <div class="first" id="first-app" hidden>
        <h2 id="first-title">Create your first FadoDB application</h2>
        <p id="first-about"></p>
        <a class="button" id="first-go" href="app.html?new" hidden>New app</a>
      </div>

      <section class="loose" id="loose" aria-labelledby="loose-title" hidden>
        <h2 id="loose-title"></h2>
        <ul class="loose-lists" id="loose-lists"></ul>
      </section>
    </section>
  </main>
</div>

</body>
</html>
